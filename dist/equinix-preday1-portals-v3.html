:root {
  /* Equinix palette */
  --eq-red:#E91C24; --eq-dark-red:#AD050C; --eq-light-red:#FFEBEE;
  --eq-blue:#086AE3; --eq-dark-blue:#00408C; --eq-light-blue:#CCE3FF;
  --eq-aqua:#85F0F8; --eq-dark-aqua:#00737A; --eq-light-aqua:#C7FDFF;
  --eq-green:#33A85C; --eq-dark-green:#2A8346; --eq-light-green:#DFFBE5;
  --eq-yellow:#FEDC86; --eq-dark-yellow:#FDB90D; --eq-light-yellow:#FFF1CC;
  --eq-orange:#FE9234; --eq-dark-orange:#F55200; --eq-light-orange:#FFE4CC;
  --eq-violet:#7739D9; --eq-dark-violet:#411980; --eq-light-violet:#E9DBFF;
  --eq-maroon:#A20238; --eq-light-maroon:#FFCCDD;
  /* Neutrals */
  --black:#000000; --charcoal:#2F3541; --carbon:#5A657B; --platinum:#8B93A3;
  --chrome:#A4AAB7; --nickel:#BDC1CA; --titanium:#D0D2DA; --cloud:#E1E3E7;
  --silver:#F2F3F4; --white:#FFFFFF;
  /* Semantic */
  --ink:var(--charcoal); --ink-soft:var(--carbon); --ink-faint:var(--platinum);
  --line:var(--cloud); --line-strong:var(--titanium);
  --bg:var(--silver); --surface:var(--white);
  --action:var(--eq-blue); --action-deep:var(--eq-dark-blue);
  --ok:var(--eq-dark-green); --ok-bg:var(--eq-light-green);
  --warn:var(--eq-dark-orange); --warn-bg:var(--eq-light-orange);
  --review:var(--eq-dark-violet); --review-bg:var(--eq-light-violet);
  --radius:10px; --radius-lg:14px;
  --shadow-1:0 1px 2px rgba(47,53,65,.06), 0 1px 6px rgba(47,53,65,.07);
  --shadow-2:0 6px 24px rgba(47,53,65,.13);
  --maxw:1200px;
}

* { box-sizing:border-box; margin:0; padding:0; }
html { -webkit-font-smoothing:antialiased; }
body {
  font-family:'Nexa Text', 'Segoe UI', Arial, sans-serif;
  font-weight:400; font-size:15px; line-height:1.55;
  color:var(--ink); background:var(--bg);
  min-width:1180px; /* laptop-only prototype (A-28) */
}
h1,h2,h3,h4 { font-weight:800; color:var(--charcoal); line-height:1.25; }
h1{font-size:26px;} h2{font-size:20px;} h3{font-size:16px;} h4{font-size:14px;}
p{color:var(--ink-soft);}
a{color:var(--action); text-decoration:none;}
a:hover{text-decoration:underline;}
button{font-family:inherit;}
small{color:var(--ink-faint);}

/* ---------- Icons (CSS mask over brand SVGs) ---------- */
.ic{
  display:inline-block; width:16px; height:16px; flex:none;
  background-color:currentColor;
  -webkit-mask-repeat:no-repeat; -webkit-mask-position:center; -webkit-mask-size:contain;
  mask-repeat:no-repeat; mask-position:center; mask-size:contain;
  vertical-align:-2px;
}
.ic.lg{width:20px;height:20px;} .ic.xl{width:28px;height:28px;} .ic.sm{width:13px;height:13px;}

/* ---------- Prototype ribbon ---------- */
.proto-ribbon{
  background:var(--charcoal); color:var(--nickel);
  font-size:12px; font-weight:350; letter-spacing:.02em;
  display:flex; align-items:center; justify-content:center; gap:14px;
  padding:5px 24px; position:sticky; top:0; z-index:60;
}
.proto-ribbon b{color:var(--white); font-weight:700;}
.proto-ribbon .rb-link{color:var(--eq-aqua); cursor:pointer; font-weight:400;}
.proto-ribbon .rb-link:hover{text-decoration:underline;}

/* ---------- Header ---------- */
.hdr{
  background:var(--surface); border-bottom:1px solid var(--line);
  position:sticky; top:26px; z-index:50;
}
.hdr-in{
  max-width:var(--maxw); margin:0 auto; padding:14px 32px;
  display:flex; align-items:center; gap:28px;
}
.brand{display:flex; align-items:center; gap:12px; cursor:pointer;}
.brand img{height:26px; display:block;}
.brand .wordmark{
  font-weight:800; font-size:17px; letter-spacing:.42em; color:var(--black);
  transform:translateY(1px);
}
.brand .sub{
  font-weight:350; font-size:12px; color:var(--carbon); letter-spacing:.02em;
  border-left:1px solid var(--line-strong); padding-left:12px; margin-left:2px;
}
.hdr-spacer{flex:1;}
.hdr-you{display:flex; align-items:center; gap:14px; text-align:right;}
.hdr-you .who{font-weight:700; font-size:14px; color:var(--charcoal);}
.hdr-you .when{font-size:12.5px; color:var(--carbon); font-weight:350;}
.hdr-you .when b{color:var(--eq-dark-blue); font-weight:700;}
.avatar{
  width:38px; height:38px; border-radius:50%; flex:none;
  display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:13px; color:var(--eq-dark-blue);
  background:linear-gradient(135deg, var(--eq-light-blue), var(--eq-light-aqua));
  border:1px solid var(--eq-light-blue);
}
.avatar.sm{width:32px;height:32px;font-size:11px;}
.avatar.lg{width:52px;height:52px;font-size:16px;}
.avatar.mgr{background:linear-gradient(135deg,var(--eq-light-violet),var(--eq-light-blue)); color:var(--eq-dark-violet);}
.avatar.pex{background:linear-gradient(135deg,var(--eq-light-green),var(--eq-light-aqua)); color:var(--eq-dark-green);}
.avatar.rec{background:linear-gradient(135deg,var(--eq-light-yellow),var(--eq-light-orange)); color:var(--eq-dark-orange);}
.avatar.peer{background:var(--silver); color:var(--carbon); border:1px solid var(--line);}

/* ---------- Page scaffold ---------- */
.page{max-width:var(--maxw); margin:0 auto; padding:28px 32px 120px;}
.crumbs{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--carbon); margin-bottom:18px;}
.crumbs .back{
  display:inline-flex; align-items:center; gap:6px; color:var(--action);
  cursor:pointer; font-weight:700; background:none; border:none; font-size:13px;
}
.crumbs .back:hover{text-decoration:underline;}

/* ---------- Hero (landing) ---------- */
.hero{
  border-radius:var(--radius-lg); overflow:hidden; position:relative;
  background:linear-gradient(104deg, var(--eq-light-blue) 0%, var(--eq-light-aqua) 62%, var(--eq-light-green) 100%);
  padding:30px 34px 26px; margin-bottom:26px;
}
.hero .hex-decor{position:absolute; right:-30px; top:-60px; width:340px; opacity:.5; pointer-events:none;}
.hero h1{font-size:27px; color:var(--charcoal); margin-bottom:6px; position:relative;}
.hero .lede{font-size:15px; color:var(--charcoal); font-weight:350; max-width:640px; position:relative;}
.hero .prog-row{display:flex; align-items:flex-end; gap:40px; margin-top:24px; position:relative;}
.prog-count{min-width:210px;}
.prog-count .nums{font-size:13px; font-weight:700; color:var(--eq-dark-blue); margin-bottom:7px; display:flex; justify-content:space-between;}
.prog-bar{height:8px; background:rgba(255,255,255,.75); border-radius:99px; overflow:hidden;}
.prog-bar i{display:block; height:100%; border-radius:99px;
  background:linear-gradient(90deg, var(--eq-blue), var(--eq-dark-aqua)); transition:width .45s ease;}
/* Milestones */
.miles{display:flex; align-items:flex-start; flex:1; max-width:640px;}
.mile{flex:1; position:relative; text-align:center;}
.mile .dot{
  width:22px; height:22px; border-radius:50%; margin:0 auto 7px; position:relative; z-index:2;
  background:var(--white); border:2px solid var(--chrome); color:var(--white);
  display:flex; align-items:center; justify-content:center;
}
.mile .bar{position:absolute; top:10px; left:calc(-50% + 11px); right:calc(50% + 11px); height:2px; background:var(--chrome); z-index:1;}
.mile:first-child .bar{display:none;}
.mile.done .dot{background:var(--eq-dark-green); border-color:var(--eq-dark-green);}
.mile.done .bar{background:var(--eq-dark-green);}
.mile.now .dot{background:var(--white); border-color:var(--eq-blue);}
.mile.now .dot i{width:8px;height:8px;border-radius:50%;background:var(--eq-blue);}
.mile.now .bar{background:var(--eq-dark-green);}
.mile .lbl{font-size:12px; font-weight:700; color:var(--carbon); line-height:1.3;}
.mile.now .lbl{color:var(--eq-dark-blue);}
.mile.done .lbl{color:var(--eq-dark-green);}

/* Ready banner (all complete) */
.ready-banner{
  border-radius:var(--radius-lg); margin-bottom:26px; padding:26px 30px;
  background:linear-gradient(100deg, var(--eq-light-green), var(--eq-light-aqua));
  border:1px solid #b5ecc4; display:flex; gap:18px; align-items:flex-start;
}
.ready-banner .ic{color:var(--eq-dark-green);}
.ready-banner h2{margin-bottom:6px;}
.ready-banner p{color:var(--charcoal); font-weight:350; max-width:720px;}

/* ---------- Layout: task list + rail ---------- */
.landing-grid{display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:28px; align-items:start;}

.section-h{display:flex; align-items:baseline; gap:10px; margin:26px 0 12px;}
.section-h:first-child{margin-top:0;}
.section-h h2{font-size:18px;}
.section-h .hint{font-size:13px; color:var(--ink-faint); font-weight:350;}

/* Task cards */
.tcards{display:flex; flex-direction:column; gap:12px;}
.tcard{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow-1); padding:18px 20px; display:flex; gap:16px; align-items:flex-start;
  cursor:pointer; transition:border-color .15s, box-shadow .15s; position:relative;
}
.tcard:hover{border-color:var(--eq-light-blue); box-shadow:var(--shadow-2);}
.tcard .tic{
  width:40px; height:40px; border-radius:10px; flex:none; display:flex; align-items:center; justify-content:center;
  background:var(--silver); color:var(--eq-dark-blue);
}
.tcard.done .tic{background:var(--ok-bg); color:var(--ok);}
.tcard .t-main{flex:1; min-width:0;}
.tcard .t-name{font-weight:800; font-size:15.5px; color:var(--charcoal); display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.tcard .t-why{font-size:13.5px; color:var(--carbon); font-weight:350; margin-top:3px;}
.tcard .t-meta{display:flex; gap:16px; margin-top:10px; font-size:12.5px; color:var(--carbon); align-items:center; flex-wrap:wrap;}
.tcard .t-meta .m{display:inline-flex; align-items:center; gap:6px;}
.tcard .t-meta .m .ic{color:var(--platinum);}
.tcard .t-meta .m.overdue{color:var(--warn); font-weight:700;}
.tcard .t-meta .m.overdue .ic{color:var(--warn);}
.tcard .t-side{display:flex; flex-direction:column; align-items:flex-end; gap:8px;}
.tcard .go{color:var(--nickel);}
.tcard:hover .go{color:var(--eq-blue);}

/* status chips */
.chip{
  display:inline-flex; align-items:center; gap:6px;
  font-size:11.5px; font-weight:700; letter-spacing:.02em;
  padding:3px 10px; border-radius:99px; white-space:nowrap;
}
.chip.notstarted{background:var(--silver); color:var(--carbon); border:1px solid var(--line-strong);}
.chip.inprogress{background:var(--eq-light-blue); color:var(--eq-dark-blue);}
.chip.done{background:var(--ok-bg); color:var(--ok);}
.chip.review{background:var(--review-bg); color:var(--review);}
.chip.overdue{background:var(--warn-bg); color:var(--warn);}
.chip.waiting{background:var(--silver); color:var(--platinum); border:1px dashed var(--line-strong);}
.chip.info{background:var(--eq-light-aqua); color:var(--eq-dark-aqua);}

/* per-task mini progress */
.mini-prog{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--carbon);}
.mini-prog .bar{width:90px; height:5px; border-radius:99px; background:var(--cloud); overflow:hidden;}
.mini-prog .bar i{display:block; height:100%; background:var(--eq-blue); border-radius:99px;}

/* Overdue help strip inside card */
.overdue-note{
  margin-top:10px; padding:9px 12px; border-radius:8px;
  background:var(--warn-bg); color:#8a3200; font-size:12.5px; font-weight:350;
  display:flex; align-items:center; gap:8px;
}
.overdue-note b{font-weight:700;}
.overdue-note .help-link{color:var(--eq-dark-blue); font-weight:700; cursor:pointer;}

/* Coming up */
.ucard{
  background:var(--surface); border:1px dashed var(--line-strong); border-radius:var(--radius);
  padding:14px 18px; cursor:pointer; transition:border-color .15s;
}
.ucard:hover{border-color:var(--chrome);}
.ucard .u-row{display:flex; align-items:center; gap:12px;}
.ucard .u-name{font-weight:700; font-size:14px; color:var(--carbon); flex:1; display:flex; gap:8px; align-items:center;}
.ucard .u-open{font-size:12.5px; color:var(--ink-faint); display:inline-flex; gap:6px; align-items:center;}
.ucard .u-note{font-size:13px; color:var(--carbon); font-weight:350; margin-top:4px;}
.ucard .u-expl{
  margin-top:10px; padding:10px 14px; border-radius:8px; background:var(--silver);
  font-size:13px; color:var(--carbon); font-weight:350; display:none;
}
.ucard.open .u-expl{display:block;}
.ucards{display:flex; flex-direction:column; gap:8px;}

/* Handled by other teams */
.ocard{
  background:var(--silver); border:1px solid var(--line); border-radius:var(--radius);
  padding:15px 18px; display:flex; gap:14px; align-items:flex-start;
}
.ocard .tic{width:34px;height:34px;border-radius:8px;background:var(--white);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--carbon);flex:none;}
.ocard .o-name{font-weight:700; font-size:14px; color:var(--charcoal); display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.ocard .o-note{font-size:13px; color:var(--carbon); font-weight:350; margin-top:3px; max-width:560px;}
.ocards{display:flex; flex-direction:column; gap:8px;}

/* ---------- Right rail ---------- */
.rail{display:flex; flex-direction:column; gap:16px; position:sticky; top:118px;}
.rail-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-1); padding:18px;}
.rail-card h3{font-size:14px; margin-bottom:12px;}
.contact{display:flex; gap:12px; align-items:flex-start; padding:10px 0;}
.contact + .contact{border-top:1px solid var(--line);}
.contact .c-name{font-weight:700; font-size:14px; color:var(--charcoal);}
.contact .c-role{font-size:12px; color:var(--ink-faint); margin-bottom:6px;}
.contact .c-links{display:flex; gap:12px; font-size:12.5px;}
.contact .c-links a{display:inline-flex; align-items:center; gap:5px; font-weight:700;}
.rail-note{font-size:12px; color:var(--ink-faint); font-weight:350; margin-top:10px; padding-top:10px; border-top:1px solid var(--line);}
.res-list{list-style:none;}
.res-list li{padding:7px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
.res-list li:last-child{border-bottom:none;}
.res-list a{font-weight:700; display:inline-flex; gap:7px; align-items:center;}
.res-list [data-resbody]{display:none;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  font-weight:700; font-size:14px; border-radius:8px; cursor:pointer;
  padding:10px 20px; border:1px solid transparent; transition:background .15s,border-color .15s,color .15s;
}
.btn.primary{background:var(--eq-blue); color:var(--white);}
.btn.primary:hover{background:var(--eq-dark-blue);}
.btn.primary:disabled{background:var(--nickel); cursor:not-allowed; color:var(--white);}
.btn.secondary{background:var(--white); color:var(--eq-dark-blue); border-color:var(--titanium);}
.btn.secondary:hover{border-color:var(--eq-blue);}
.btn.quiet{background:none; color:var(--carbon); border:none; font-weight:400; text-decoration:underline; padding:10px 6px;}
.btn.quiet:hover{color:var(--charcoal);}
.btn.danger-quiet{background:none; color:var(--eq-dark-red); border:none; font-weight:400; text-decoration:underline; padding:10px 6px;}
.btn.sm{padding:7px 14px; font-size:13px;}

/* ---------- Forms ---------- */
.field{margin-bottom:16px; max-width:520px;}
.field label{display:block; font-weight:700; font-size:13px; color:var(--charcoal); margin-bottom:5px;}
.field label .opt{font-weight:350; color:var(--ink-faint);}
.field .note{font-size:12px; color:var(--ink-faint); font-weight:350; margin-top:5px; line-height:1.45;}
.field input[type=text], .field input[type=email], .field input[type=tel],
.field select, .field textarea{
  width:100%; font-family:inherit; font-size:14px; color:var(--charcoal);
  padding:9px 12px; border:1px solid var(--titanium); border-radius:8px; background:var(--white);
  outline:none; transition:border-color .12s, box-shadow .12s;
}
.field input:focus, .field select:focus, .field textarea:focus{
  border-color:var(--eq-blue); box-shadow:0 0 0 3px var(--eq-light-blue);
}
.field.invalid input, .field.invalid select, .field.invalid textarea{border-color:var(--eq-dark-orange);}
.field .err{display:none; font-size:12px; color:var(--warn); font-weight:700; margin-top:5px;}
.field.invalid .err{display:block;}
.field.prefilled input, .field.prefilled select{
  background:#F4F9FF; border-color:var(--eq-light-blue);
}
.prefill-tag{
  display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:700;
  color:var(--eq-dark-blue); background:var(--eq-light-blue); border-radius:4px;
  padding:1px 6px; margin-left:7px; letter-spacing:.03em; vertical-align:1px;
}
.field.readonly input{background:var(--silver); color:var(--carbon); border-color:var(--line);}
.field-row{display:flex; gap:14px; max-width:520px;}
.field-row .field{flex:1; margin-bottom:16px; max-width:none;}
.field-row .field.narrow{flex:0 0 130px;}

.check{display:flex; gap:10px; align-items:flex-start; max-width:560px; cursor:pointer;}
.check input{margin-top:3px; width:16px; height:16px; accent-color:var(--eq-blue); flex:none; cursor:pointer;}
.check span{font-size:13.5px; color:var(--charcoal); font-weight:350;}
.check.disabled{opacity:.55; cursor:not-allowed;}
.check.disabled input{cursor:not-allowed;}

.radio-row{display:flex; gap:18px; flex-wrap:wrap;}
.radio-row label{display:inline-flex; gap:7px; align-items:center; font-size:13.5px; font-weight:350; color:var(--charcoal); cursor:pointer;}
.radio-row input{accent-color:var(--eq-blue);}

/* verified state */
.verified{
  display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:700;
  color:var(--ok); background:var(--ok-bg); padding:5px 12px; border-radius:99px; margin-top:4px;
}

/* ---------- Wizard ---------- */
.task-head{margin-bottom:20px;}
.task-head h1{margin-bottom:6px;}
.task-head .why{color:var(--carbon); font-weight:350; max-width:680px;}
.task-shell{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow-1); overflow:hidden; max-width:940px;}
.wiz-tabs{display:flex; border-bottom:1px solid var(--line); background:var(--silver); padding:0 10px;}
.wiz-tab{
  padding:14px 22px 12px; cursor:pointer; border:none; background:none;
  font-size:14px; font-weight:700; color:var(--carbon);
  border-bottom:3px solid transparent; display:flex; align-items:center; gap:9px;
}
.wiz-tab:hover{color:var(--charcoal);}
.wiz-tab.on{color:var(--eq-dark-blue); border-bottom-color:var(--eq-blue); background:var(--white);}
.tab-count{font-size:11px; font-weight:700; color:var(--carbon); background:var(--cloud); border-radius:99px; padding:2px 8px;}
.tab-count.ok{background:var(--ok-bg); color:var(--ok);}
.wiz-body{padding:26px 30px 30px;}
.wiz-foot{
  border-top:1px solid var(--line); padding:16px 30px; display:flex; align-items:center; gap:16px;
  background:var(--silver);
}
.wiz-foot .missing{font-size:12.5px; color:var(--carbon); font-weight:350; flex:1;}
.saved-state{display:inline-flex; align-items:center; gap:7px; font-size:12.5px; color:var(--carbon); font-weight:350;}
.saved-state .ic{color:var(--eq-dark-green);}

.form-sec{margin-bottom:26px;}
.form-sec > h3{margin-bottom:4px; display:flex; align-items:center; gap:8px;}
.form-sec > .sec-note{font-size:13px; color:var(--carbon); font-weight:350; margin-bottom:14px; max-width:620px;}

/* collapsible / group cards */
.gcard{border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; margin-bottom:16px; background:var(--white);}
.gcard.tinted{background:var(--silver);}
.gcard-h{display:flex; align-items:center; gap:10px; cursor:pointer;}
.gcard-h h4{flex:1; font-size:14px;}
.gcard .gbody{margin-top:14px;}

/* boundary / locked card */
.boundary{
  border:1px solid var(--line-strong); border-left:4px solid var(--eq-dark-blue);
  background:var(--silver); border-radius:var(--radius); padding:18px 20px;
  display:flex; gap:14px; margin-top:8px;
}
.boundary .ic{color:var(--eq-dark-blue); margin-top:2px;}
.boundary h4{margin-bottom:4px; display:flex; align-items:center; gap:8px;}
.boundary p{font-size:13px; font-weight:350; max-width:560px;}
.boundary a{font-weight:700; font-size:13px;}

/* confirmation panel */
.confirm-panel{
  text-align:center; padding:60px 40px;
}
.confirm-panel .big-check{
  width:64px; height:64px; margin:0 auto 18px; border-radius:50%;
  background:var(--ok-bg); color:var(--ok); display:flex; align-items:center; justify-content:center;
}
.confirm-panel h2{margin-bottom:8px;}
.confirm-panel p{max-width:520px; margin:0 auto 22px; font-weight:350;}

/* ---------- Job description ---------- */
.jd-grid{display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:24px; align-items:start;}
.role-card .kv{display:grid; grid-template-columns:170px 1fr; gap:6px 18px; font-size:14px;}
.role-card .kv dt{color:var(--ink-faint); font-weight:350;}
.role-card .kv dd{color:var(--charcoal); font-weight:700;}
.src-tag{
  display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700;
  color:var(--carbon); background:var(--cloud); border-radius:4px; padding:2px 8px; letter-spacing:.02em;
}
.comp-line{font-size:13px; color:var(--carbon); font-weight:350; margin-top:14px; padding-top:12px; border-top:1px solid var(--line); display:flex; gap:8px; align-items:center;}
.jd-doc{
  border:1px solid var(--line); border-radius:var(--radius); background:var(--white);
  max-height:420px; overflow-y:auto; padding:22px 26px; font-size:14px; color:var(--charcoal);
}
.jd-doc h4{margin:18px 0 6px;} .jd-doc h4:first-child{margin-top:0;}
.jd-doc p, .jd-doc li{font-weight:350; color:var(--charcoal); margin-bottom:8px;}
.jd-doc ul{padding-left:20px;}
.scroll-hint{font-size:12px; color:var(--ink-faint); font-weight:350; display:flex; gap:6px; align-items:center; margin-top:8px;}
.scroll-hint.ok{color:var(--ok); font-weight:700;}
.internal-link{
  display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:13.5px;
  color:var(--eq-dark-blue); background:var(--eq-light-blue); border-radius:8px; padding:9px 14px; cursor:pointer;
}
.internal-link small{color:var(--eq-dark-blue); font-weight:350; opacity:.8;}
/* team view */
.team-view{display:flex; flex-direction:column; align-items:center; gap:0;}
.tnode{display:flex; align-items:center; gap:10px; background:var(--white); border:1px solid var(--line); border-radius:10px; padding:8px 14px; min-width:230px;}
.tnode .tn-name{font-weight:700; font-size:13px; color:var(--charcoal);}
.tnode .tn-role{font-size:11.5px; color:var(--ink-faint);}
.tnode.you{border-color:var(--eq-blue); box-shadow:0 0 0 3px var(--eq-light-blue);}
.tline{width:2px; height:14px; background:var(--titanium);}
.peer-row{display:flex; gap:10px; margin-top:0; flex-wrap:wrap; justify-content:center;}
.peer-row .tnode{min-width:0;}
/* dissent */
.dissent-box{border:1px solid var(--eq-light-violet); background:#FBF8FF; border-radius:var(--radius); padding:18px 20px; margin-top:16px;}
.review-banner{
  border-radius:var(--radius); background:var(--review-bg); color:var(--review);
  padding:16px 20px; display:flex; gap:12px; align-items:flex-start; margin-bottom:18px;
}
.review-banner b{display:block; margin-bottom:2px;}
.review-banner p{color:var(--review); font-weight:350; font-size:13.5px;}

/* ---------- Intro & photo ---------- */
.two-sec{display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start;}
.sec-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow-1); padding:24px 26px;}
.sec-card > .sec-top{display:flex; align-items:flex-start; gap:10px; margin-bottom:6px;}
.sec-card > .sec-top h2{flex:1; font-size:17px;}
.sec-card .due-line{font-size:12.5px; color:var(--carbon); display:flex; gap:6px; align-items:center; margin-bottom:12px;}
.sec-card .due-line .ic{color:var(--platinum);}
.sec-card .due-line b{color:var(--charcoal); white-space:nowrap;}
.char-count{font-size:12px; color:var(--ink-faint); text-align:right; margin-top:4px;}
.char-count.warn{color:var(--warn); font-weight:700;}
.chips-row{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 4px;}
.p-chip{
  display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:700;
  color:var(--eq-dark-blue); background:var(--eq-light-blue); border:none; border-radius:99px;
  padding:6px 12px; cursor:pointer;
}
.p-chip:hover{background:#b9d8ff;}
.p-chip .x{opacity:.6; font-weight:400;}
.preview-panel{border:1px solid var(--line); border-radius:var(--radius); background:var(--silver); padding:16px 18px; margin-top:18px;}
.preview-panel .pv-h{font-size:11.5px; font-weight:700; letter-spacing:.06em; color:var(--ink-faint); text-transform:uppercase; margin-bottom:10px;}
.pv-msg{background:var(--white); border:1px solid var(--line); border-radius:10px; padding:14px 16px; display:flex; gap:12px;}
.pv-msg .pv-body{flex:1; min-width:0;}
.pv-msg .pv-name{font-weight:700; font-size:13px;}
.pv-msg .pv-sub{font-size:11.5px; color:var(--ink-faint); margin-bottom:6px;}
.pv-msg .pv-text{font-size:13px; font-weight:350; color:var(--charcoal); white-space:pre-wrap;}
.pv-empty{color:var(--ink-faint); font-style:italic;}
.share-model{
  display:flex; gap:10px; align-items:flex-start; font-size:12.5px; color:var(--carbon);
  font-weight:350; background:var(--eq-light-aqua); border-radius:8px; padding:10px 14px; margin-top:14px;
}
.share-model .ic{color:var(--eq-dark-aqua); margin-top:1px;}
/* upload */
.dropzone{
  border:2px dashed var(--titanium); border-radius:var(--radius); padding:30px 20px;
  text-align:center; cursor:pointer; transition:border-color .15s, background .15s;
  color:var(--carbon);
}
.dropzone:hover, .dropzone.drag{border-color:var(--eq-blue); background:#F4F9FF;}
.dropzone .ic{color:var(--platinum); margin-bottom:8px;}
.dropzone b{color:var(--eq-dark-blue);}
.photo-preview{display:flex; gap:18px; align-items:center;}
.photo-frame{
  width:150px; height:150px; border-radius:12px; overflow:hidden; position:relative; flex:none;
  background:var(--cloud);
}
.photo-frame img{width:100%; height:100%; object-fit:cover; display:block;}
.photo-frame .crop-guide{
  position:absolute; inset:0;
  background:radial-gradient(circle at 50% 42%, transparent 52px, rgba(47,53,65,.42) 53px);
}
.photo-frame .crop-ring{
  position:absolute; left:50%; top:42%; width:106px; height:106px; transform:translate(-50%,-50%);
  border:2px dashed rgba(255,255,255,.9); border-radius:50%;
}
.req-list{font-size:12.5px; color:var(--carbon); font-weight:350; line-height:1.7;}
.req-list b{color:var(--charcoal);}
/* on-file photo (conversion) */
.onfile{display:flex; gap:16px; align-items:center;}
.onfile .photo-frame{width:120px;height:120px;}
.onfile-sil{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--platinum);
  background:linear-gradient(160deg,var(--cloud),var(--silver));}

/* ---------- Policies ---------- */
.pol-head{display:flex; align-items:center; gap:22px; margin-bottom:18px;}
.pol-head .prog-count{min-width:180px;}
.doc-list{display:flex; flex-direction:column; gap:10px;}
.doc{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow-1); overflow:hidden;
}
.doc.acked{border-color:#b5ecc4;}
.doc-h{display:flex; align-items:center; gap:14px; padding:15px 20px; cursor:pointer;}
.doc-h .dic{width:34px;height:34px;border-radius:8px;background:var(--silver);display:flex;align-items:center;justify-content:center;color:var(--eq-dark-blue);flex:none;}
.doc.acked .dic{background:var(--ok-bg); color:var(--ok);}
.doc-h .d-name{font-weight:800; font-size:14.5px; color:var(--charcoal); display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.doc-h .d-desc{font-size:13px; color:var(--carbon); font-weight:350; margin-top:2px;}
.doc-h .d-main{flex:1; min-width:0;}
.doc-h .chev{color:var(--nickel);}
.doc-body{border-top:1px solid var(--line); padding:18px 20px; display:none;}
.doc.open .doc-body{display:block;}
.doc-text{
  border:1px solid var(--line); border-radius:8px; background:var(--silver);
  max-height:260px; overflow-y:auto; padding:16px 20px; font-size:13.5px; font-weight:350; color:var(--charcoal);
}
.doc-text h5{font-size:13px; margin:12px 0 4px; color:var(--charcoal);}
.doc-text h5:first-child{margin-top:0;}
.doc-text p{margin-bottom:8px; color:var(--charcoal);}
.addendum{
  border:1px solid var(--eq-light-blue); border-left:4px solid var(--eq-blue);
  background:#F4F9FF; border-radius:8px; padding:12px 16px; margin:12px 0;
}
.addendum .add-h{font-weight:800; font-size:12.5px; color:var(--eq-dark-blue); display:flex; gap:8px; align-items:center; margin-bottom:6px;}
.ack-row{display:flex; align-items:flex-start; gap:12px; margin-top:14px;}
.ack-row .check{flex:1;}
.ack-done{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ok); font-weight:700; margin-top:12px;}
.ack-done .rec-note{color:var(--ink-faint); font-weight:350;}
/* external doc */
.doc.external{border-style:solid; border-color:var(--eq-light-violet); background:#FDFBFF;}
.doc.external .dic{background:var(--eq-light-violet); color:var(--eq-dark-violet);}
.ext-banner{
  display:flex; gap:10px; align-items:flex-start; font-size:13px; font-weight:350; color:var(--charcoal);
  background:var(--eq-light-violet); border-radius:8px; padding:12px 16px; margin-bottom:14px;
}
.ext-banner .ic{color:var(--eq-dark-violet); margin-top:1px;}
.return-banner{
  display:flex; gap:10px; align-items:center; font-size:13px; color:var(--ok); font-weight:700;
  background:var(--ok-bg); border-radius:8px; padding:11px 16px; margin-bottom:14px;
}
/* reading material group */
.read-group{margin-top:26px;}
.read-card{
  background:var(--silver); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px 18px; display:flex; gap:13px; align-items:center;
}
.read-card .o-name{font-weight:700; font-size:14px;}
.read-card .o-note{font-size:12.5px; color:var(--carbon); font-weight:350;}
.read-cards{display:flex; flex-direction:column; gap:8px;}

/* ---------- Assumption markers ---------- */
.am{
  display:inline-flex; align-items:center; font-size:10px; font-weight:700; letter-spacing:.04em;
  color:var(--eq-dark-aqua); background:var(--eq-light-aqua); border:1px solid #9fe8ee;
  border-radius:4px; padding:0 5px; height:16px; cursor:pointer; vertical-align:2px;
  line-height:1; user-select:none;
}
.am:hover{background:#a9f0f6;}
.assume-flash{animation:assumeflash 2.4s ease;}
@keyframes assumeflash{
  0%,60%{box-shadow:0 0 0 3px var(--eq-aqua); border-radius:6px;}
  100%{box-shadow:0 0 0 3px transparent;}
}

/* ---------- Slide-over panels ---------- */
.overlay{position:fixed; inset:0; background:rgba(47,53,65,.35); z-index:90; display:none;}
.overlay.show{display:block;}
.panel{
  position:fixed; top:0; right:-480px; width:460px; height:100vh; background:var(--surface);
  z-index:95; box-shadow:var(--shadow-2); display:flex; flex-direction:column;
  transition:right .25s ease;
}
.panel.show{right:0;}
.panel-h{display:flex; align-items:center; gap:12px; padding:18px 22px; border-bottom:1px solid var(--line);}
.panel-h h2{flex:1; font-size:16px;}
.panel-h .x{background:none;border:none;color:var(--carbon);cursor:pointer;padding:4px;}
.panel-b{flex:1; overflow-y:auto; padding:18px 22px;}
.panel-note{font-size:12.5px; color:var(--carbon); font-weight:350; background:var(--silver); border-radius:8px; padding:10px 14px; margin-bottom:16px;}

/* assumptions panel */
.ag-h{font-size:12px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-faint); margin:18px 0 8px;}
.ag-h:first-of-type{margin-top:0;}
.ag-h .cnt{font-weight:400;}
.a-entry{
  border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:8px; cursor:pointer;
  transition:border-color .15s;
}
.a-entry:hover{border-color:var(--eq-aqua);}
.a-entry.hl{border-color:var(--eq-dark-aqua); box-shadow:0 0 0 2px var(--eq-light-aqua);}
.a-entry .a-top{display:flex; gap:8px; align-items:center; margin-bottom:5px;}
.a-entry .a-id{font-size:11px; font-weight:800; color:var(--eq-dark-aqua); background:var(--eq-light-aqua); border-radius:4px; padding:1px 6px;}
.a-entry .a-screen{font-size:11.5px; color:var(--ink-faint);}
.a-entry .a-oi{margin-left:auto; font-size:11px; color:var(--platinum); font-weight:700;}
.a-entry .a-text{font-size:13px; color:var(--charcoal); font-weight:350; line-height:1.45;}
.a-entry .a-resolve{font-size:12px; color:var(--carbon); font-weight:350; margin-top:6px; padding-top:6px; border-top:1px dashed var(--line);}
.a-entry .a-resolve b{color:var(--charcoal); font-weight:700;}
.a-entry .nolink{font-size:11px; color:var(--platinum); font-style:italic; margin-top:4px;}

/* chat panel */
.chat-fab{
  position:fixed; right:26px; bottom:26px; z-index:80;
  display:flex; align-items:center; gap:10px; border:none; cursor:pointer;
  background:var(--eq-dark-blue); color:var(--white); border-radius:99px;
  padding:12px 20px; font-weight:700; font-size:14px; box-shadow:var(--shadow-2);
}
.chat-fab:hover{background:var(--eq-blue);}
.chat-msgs{display:flex; flex-direction:column; gap:10px;}
.msg{max-width:85%; border-radius:12px; padding:10px 14px; font-size:13.5px; font-weight:350;}
.msg.bot{background:var(--silver); color:var(--charcoal); align-self:flex-start; border-bottom-left-radius:4px;}
.msg.me{background:var(--eq-light-blue); color:var(--eq-dark-blue); align-self:flex-end; border-bottom-right-radius:4px;}
.chat-quick{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
.chat-in{display:flex; gap:8px; padding:14px 22px; border-top:1px solid var(--line);}
.chat-in input{flex:1; font-family:inherit; font-size:13.5px; padding:9px 12px; border:1px solid var(--titanium); border-radius:8px; outline:none;}
.chat-in input:focus{border-color:var(--eq-blue);}
.chat-hand{font-size:12px; color:var(--ink-faint); font-weight:350; padding:0 22px 12px;}

/* ---------- Prototype controls ---------- */
.proto-fab{
  position:fixed; left:26px; bottom:26px; z-index:80;
  display:flex; align-items:center; gap:8px; cursor:pointer; border:none;
  background:var(--charcoal); color:var(--eq-aqua); border-radius:99px;
  padding:10px 18px; font-weight:700; font-size:12.5px; box-shadow:var(--shadow-2);
  letter-spacing:.02em;
}
.proto-fab:hover{background:var(--black);}
.proto-drawer{
  position:fixed; left:26px; bottom:78px; z-index:85; width:330px;
  background:var(--charcoal); color:var(--cloud); border-radius:14px; box-shadow:var(--shadow-2);
  padding:18px 20px; display:none;
}
.proto-drawer.show{display:block;}
.proto-drawer h3{color:var(--white); font-size:13px; letter-spacing:.05em; text-transform:uppercase; display:flex; gap:8px; align-items:center;}
.proto-drawer .warn-line{font-size:11.5px; color:var(--eq-aqua); font-weight:350; margin:4px 0 14px;}
.proto-drawer .pc-h{font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--platinum); margin:14px 0 7px;}
.pc-row{display:flex; gap:8px; flex-wrap:wrap;}
.pc-btn{
  border:1px solid var(--carbon); background:none; color:var(--cloud); border-radius:99px;
  font-size:12px; font-weight:700; padding:5px 12px; cursor:pointer;
}
.pc-btn:hover{border-color:var(--eq-aqua); color:var(--eq-aqua);}
.pc-btn.on{background:var(--eq-aqua); border-color:var(--eq-aqua); color:var(--charcoal);}
.pc-links{display:flex; flex-direction:column; gap:6px; margin-top:6px;}
.pc-links a{color:var(--eq-aqua); font-size:12.5px; font-weight:700; cursor:pointer;}

/* ---------- Flow overview ---------- */
.flow-page h1{margin-bottom:4px;}
.flow-sub{color:var(--carbon); font-weight:350; margin-bottom:26px; max-width:760px;}
.flow-wrap{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow-1); padding:30px 34px; overflow-x:auto;}
.flow-axis{position:relative; height:54px; margin-bottom:8px; min-width:1060px;}
.flow-axis .axis-line{position:absolute; left:0; right:0; top:26px; height:3px; border-radius:2px;
  background:linear-gradient(90deg, var(--eq-light-blue), var(--eq-blue) 60%, var(--eq-dark-aqua));}
.axis-pt{position:absolute; top:0; transform:translateX(-50%); text-align:center; width:92px;}
.axis-pt .apt-dot{width:13px;height:13px;border-radius:50%;background:var(--white);border:3px solid var(--eq-blue);margin:20px auto 6px;}
.axis-pt.major .apt-dot{background:var(--eq-blue);}
.axis-pt .apt-lbl{font-size:11px; font-weight:800; color:var(--eq-dark-blue); line-height:1.2;}
.axis-pt .apt-sub{font-size:10.5px; color:var(--ink-faint); font-weight:350;}
.flow-lane{margin-top:18px; min-width:1060px;}
.flow-lane .lane-h{font-size:11.5px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:8px; display:flex; gap:8px; align-items:center;}
.lane-track{position:relative; height:74px; border-radius:10px; background:var(--silver); border:1px dashed var(--line-strong);}
.lane-track.other{background:repeating-linear-gradient(45deg, var(--silver), var(--silver) 8px, #eceef0 8px, #eceef0 16px);}
.fnode{
  position:absolute; top:50%; transform:translate(-50%,-50%);
  background:var(--white); border:1px solid var(--line-strong); border-radius:9px;
  padding:7px 11px; font-size:11.5px; font-weight:700; color:var(--charcoal);
  box-shadow:var(--shadow-1); white-space:nowrap; text-align:center; cursor:default;
}
.fnode small{display:block; font-size:10px; color:var(--ink-faint); font-weight:350;}
.fnode.you{border-color:var(--eq-light-blue); border-left:4px solid var(--eq-blue);}
.fnode.later{border-style:dashed; color:var(--carbon);}
.fnode.other{border-left:4px solid var(--platinum); color:var(--carbon);}
.fnode.day1{background:var(--eq-dark-blue); color:var(--white); border-color:var(--eq-dark-blue);}
.fnode.day1 small{color:var(--eq-light-blue);}
.flow-legend{display:flex; gap:22px; margin-top:22px; font-size:12px; color:var(--carbon); flex-wrap:wrap;}
.flow-legend .lg-item{display:inline-flex; gap:8px; align-items:center;}
.lg-swatch{width:14px; height:14px; border-radius:4px; border:1px solid var(--line-strong); background:var(--white);}
.lg-swatch.you{border-left:4px solid var(--eq-blue);}
.lg-swatch.later{border-style:dashed;}
.lg-swatch.other{border-left:4px solid var(--platinum);}

/* toast */
.toast{
  position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(80px);
  background:var(--charcoal); color:var(--white); font-size:13.5px; font-weight:350;
  border-radius:10px; padding:12px 20px; z-index:120; opacity:0; transition:all .3s ease;
  display:flex; gap:10px; align-items:center; box-shadow:var(--shadow-2);
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.toast .ic{color:var(--eq-aqua);}

/* utility */
.mt8{margin-top:8px;} .mt16{margin-top:16px;} .mt24{margin-top:24px;}
.hidden{display:none !important;}
.divider{height:1px; background:var(--line); margin:20px 0;}

/* ============================================================
   v2 additions
   ============================================================ */

/* five-phase strip (A-44) */
.miles{max-width:790px; position:relative;}
.miles-mark{position:absolute; right:-26px; top:-2px;}
.mile .lbl{font-size:11.5px; line-height:1.28; padding:0 6px;}

/* overflow line under Coming up — verbatim from the live portal */
.overflow-line{
  display:flex; align-items:center; gap:9px; margin:0 0 12px;
  font-size:13.5px; color:var(--charcoal); font-weight:350;
  background:var(--eq-light-yellow); border:1px solid #f7e2ad;
  border-radius:8px; padding:9px 14px;
}
.overflow-line .ic{color:var(--eq-dark-yellow);}
.overflow-line b{font-weight:700;}

/* optional / proposed task cards */
.chip.proposed{background:var(--eq-light-violet); color:var(--eq-dark-violet);}
.tcard.optional{border-style:dashed; background:#FDFDFE;}
.tcard.optional .tic{background:var(--eq-light-violet); color:var(--eq-dark-violet);}

/* "also open now" cards */
.ocard .o-main{flex:1; min-width:0;}
.ocard.live{background:var(--white); border-style:solid;}
.ocard.live .tic{background:var(--eq-light-aqua); color:var(--eq-dark-aqua); border-color:transparent;}
.ocard .o-go{
  align-self:center; flex:none; font-weight:700; font-size:13px; cursor:pointer;
  display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
}

/* contact extras (buddy timezone, marker lines) */
.c-extra{font-size:11.5px; color:var(--ink-faint); font-weight:350; line-height:1.5; margin-bottom:6px;}
.avatar.buddy{background:linear-gradient(135deg,var(--eq-light-aqua),var(--eq-light-green)); color:var(--eq-dark-aqua);}

/* reference reading */
.mod-list{margin:6px 0 8px 0; padding-left:18px; columns:2; font-size:12.5px;}
.mod-list li{padding:1px 0;}
.intent-note{
  display:flex; gap:9px; align-items:flex-start; margin-top:9px; padding:9px 12px;
  background:var(--white); border:1px dashed var(--line-strong); border-radius:8px;
  font-size:12px; color:var(--carbon); line-height:1.5;
}
.intent-note .ic{color:var(--eq-dark-violet); margin-top:2px; flex:none;}

/* callouts */
.callout{
  display:flex; gap:12px; align-items:flex-start; margin:12px 0 4px; max-width:640px;
  background:var(--eq-light-yellow); border:1px solid #f7e2ad; border-radius:10px;
  padding:12px 16px; font-size:13px; color:var(--charcoal); font-weight:350; line-height:1.55;
}
.callout .ic{color:var(--eq-dark-yellow); margin-top:2px; flex:none;}
.callout b{font-weight:700;}
.callout.soft{background:var(--eq-light-aqua); border-color:#9fe8ee;}
.callout.soft .ic{color:var(--eq-dark-aqua);}

/* identity capture (A-29 / A-30) */
.shoot-line{
  display:flex; gap:9px; align-items:flex-start; max-width:520px; margin:2px 0 12px;
  font-size:12.5px; color:var(--carbon); font-weight:350;
}
.shoot-line .ic{color:var(--platinum); margin-top:2px;}
.dropzone.sm{padding:20px 16px; max-width:520px; font-size:13.5px;}
.file-done{
  display:flex; gap:13px; align-items:center; max-width:520px;
  background:var(--ok-bg); border:1px solid #b5ecc4; border-radius:10px; padding:12px 16px;
}
.file-done .ic{color:var(--ok); flex:none;}
.file-done .fd-name{font-weight:700; font-size:13.5px; color:var(--charcoal);}
.file-done .fd-who{font-size:11.5px; color:var(--carbon); font-weight:350; margin-top:2px; display:flex; gap:5px; align-items:center;}
.excl-note{margin-top:8px; padding-top:8px; border-top:1px dashed var(--line-strong); font-size:12.5px !important;}

/* ---------- equipment ---------- */
.eq-status{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow-1); padding:20px 24px; max-width:940px;}
.eqs-h{display:flex; align-items:baseline; gap:12px; margin-bottom:12px; flex-wrap:wrap;}
.eqs-h h3{font-size:15px;}
.eqs-note{font-size:12.5px; color:var(--ink-faint); font-weight:350;}
.eq-table{width:100%; border-collapse:collapse; font-size:13px;}
.eq-table th{
  text-align:left; font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  color:var(--ink-faint); padding:0 12px 8px 0; border-bottom:1px solid var(--line);
}
.eq-table td{padding:13px 12px 13px 0; border-bottom:1px solid var(--line); vertical-align:middle;}
.eq-table tr:last-child td{border-bottom:none;}
.eq-item{display:inline-flex; align-items:center; gap:9px; font-weight:700; color:var(--charcoal);}
.eq-item .ic{color:var(--carbon);}
.owner{font-size:12.5px; font-weight:700;}
.owner.mgr{color:var(--eq-dark-violet);}
.owner.you{color:var(--eq-dark-blue);}
.status-pill{
  display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:800; letter-spacing:.04em;
  background:var(--warn-bg); color:var(--warn); border-radius:5px; padding:4px 9px; white-space:nowrap;
}
.status-pill.ok{background:var(--ok-bg); color:var(--ok);}
.eq-unblock{font-size:12.5px; color:var(--carbon); font-weight:350; line-height:1.5;}
.eq-unblock b{color:var(--charcoal); font-weight:700;}

.acc-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 20px; max-width:520px; margin-top:14px;}
.check.acc{background:var(--silver); border:1px solid var(--line); border-radius:8px; padding:10px 14px;}
.check.acc:hover{border-color:var(--eq-light-blue);}

.adjust-link{
  display:flex; gap:12px; align-items:flex-start; margin-top:18px; max-width:640px;
  background:var(--eq-light-green); border-radius:10px; padding:12px 16px;
  font-size:13px; color:var(--charcoal); font-weight:350; line-height:1.55;
}
.adjust-link .ic{color:var(--eq-dark-green); margin-top:2px; flex:none;}
.adjust-link a{font-weight:700; cursor:pointer;}

.office-card{
  display:flex; gap:14px; align-items:center; max-width:560px;
  background:var(--eq-light-blue); border-radius:10px; padding:14px 18px;
}
.office-card .ic{color:var(--eq-dark-blue); flex:none;}
.oc-label{font-size:11px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--eq-dark-blue); opacity:.75;}
.oc-addr{font-size:13.5px; font-weight:700; color:var(--charcoal); margin-top:2px;}
.radio-row.col{flex-direction:column; gap:9px;}
.home-addr{font-size:13.5px; color:var(--charcoal); font-weight:700; margin-bottom:6px;}

/* INC confirmation (A-42) */
.inc-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow-1); overflow:hidden; max-width:940px;}
.inc-h{display:flex; align-items:center; gap:12px; padding:15px 22px; background:var(--charcoal);}
.inc-num{font-weight:800; font-size:15px; color:var(--white); letter-spacing:.02em;}
.inc-team{font-size:12.5px; color:var(--nickel); margin-left:auto;}
.inc-body{display:grid; grid-template-columns:1fr 1fr; gap:0;}
.inc-sec{padding:20px 22px;}
.inc-sec + .inc-sec{border-left:1px solid var(--line);}
.inc-lbl{font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:8px;}
.inc-val{font-size:13.5px; color:var(--charcoal); font-weight:350;}
.inc-list{list-style:none; font-size:13.5px;}
.inc-list li{display:flex; gap:8px; align-items:center; padding:3px 0; color:var(--charcoal); font-weight:350;}
.inc-list .ic{color:var(--ok);}
.attach{
  display:flex; gap:8px; align-items:center; margin-top:14px; padding:9px 12px;
  background:var(--silver); border-radius:8px; font-size:12.5px; color:var(--charcoal); font-weight:350;
}
.attach .ic{color:var(--carbon);}
.inc-thread{display:flex; flex-direction:column; gap:10px; margin-bottom:12px;}
.inc-msg{display:flex; gap:10px;}
.im-name{font-weight:700; font-size:12.5px; color:var(--charcoal);}
.im-text{font-size:13px; color:var(--carbon); font-weight:350;}
.inc-empty{font-size:13px; color:var(--ink-faint); font-style:italic;}
.inc-add{display:flex; gap:8px;}
.inc-add input{flex:1; font-family:inherit; font-size:13px; padding:8px 12px; border:1px solid var(--titanium); border-radius:8px; outline:none;}
.inc-add input:focus{border-color:var(--eq-blue);}

/* ---------- suggested network (A-43) ---------- */
.proposed-banner{
  display:flex; gap:14px; align-items:flex-start; max-width:940px; margin-bottom:22px;
  background:var(--review-bg); border-radius:var(--radius); padding:16px 20px; color:var(--review);
}
.proposed-banner .ic{color:var(--eq-dark-violet); flex:none; margin-top:1px;}
.proposed-banner b{display:block; margin-bottom:3px;}
.proposed-banner p{color:var(--review); font-weight:350; font-size:13.5px;}
.net-grid{display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:24px; align-items:start;}
.net-cards{display:flex; flex-direction:column; gap:12px;}
.net-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-1); padding:18px 20px;}
.net-card.booked{border-color:#b5ecc4;}
.nc-top{display:flex; gap:14px; align-items:center; margin-bottom:12px;}
.nc-id{flex:1; min-width:0;}
.nc-name{font-weight:800; font-size:15px; color:var(--charcoal);}
.nc-role{font-size:12.5px; color:var(--ink-faint);}
.nc-why{
  background:var(--silver); border-radius:8px; padding:12px 15px; font-size:13.5px;
  color:var(--charcoal); font-weight:350; line-height:1.55;
}
.ncw-h{font-size:11px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:5px; display:flex; gap:6px; align-items:center;}
.nc-slots{display:flex; gap:8px; align-items:center; margin-top:12px; flex-wrap:wrap;}
.ncs-lbl{font-size:12.5px; color:var(--carbon); font-weight:350;}
.slot-btn{
  border:1px solid var(--titanium); background:var(--white); color:var(--eq-dark-blue);
  border-radius:99px; font-size:12.5px; font-weight:700; padding:6px 14px; cursor:pointer;
  font-family:inherit;
}
.slot-btn:hover{border-color:var(--eq-blue); background:var(--eq-light-blue);}
.distinct{display:flex; flex-direction:column; gap:14px;}
.dist-row .dr-h{font-weight:800; font-size:13px; color:var(--charcoal); display:flex; gap:7px; align-items:center; margin-bottom:3px;}
.dist-row .dr-h .ic{color:var(--eq-dark-blue);}
.dist-row p{font-size:12.5px; font-weight:350; line-height:1.5;}
.mech-list{padding-left:18px; font-size:13px;}
.mech-list li{padding:4px 0; color:var(--carbon); font-weight:350; line-height:1.5;}
.mech-list b{color:var(--charcoal);}

/* ---------- flow: phase band ---------- */
.phase-band{display:flex; gap:8px; margin-bottom:16px; align-items:center; flex-wrap:wrap;}
.phase-band .pb{
  font-size:12px; font-weight:700; color:var(--carbon);
  background:var(--white); border:1px solid var(--line-strong); border-radius:99px; padding:6px 14px;
}
.phase-band .pb.on{background:var(--eq-dark-blue); border-color:var(--eq-dark-blue); color:var(--white);}
.flow-foot{
  display:flex; gap:9px; align-items:center; margin-top:18px; padding-top:14px;
  border-top:1px solid var(--line); font-size:12.5px; color:var(--carbon); font-weight:350;
}
.flow-foot .ic{color:var(--eq-dark-yellow);}
.review-banner.ok{background:var(--ok-bg); color:var(--ok);}
.review-banner.ok b, .review-banner.ok p{color:var(--ok);}

/* ---------- assumptions panel: provenance + retired ---------- */
.prov{
  display:inline-flex; align-items:center; font-size:9.5px; font-weight:800; letter-spacing:.05em;
  border-radius:3px; padding:1px 5px; line-height:1.45; white-space:nowrap;
}
.prov.UAT{background:var(--eq-light-green); color:var(--eq-dark-green);}
.prov.11{background:var(--eq-light-blue); color:var(--eq-dark-blue);}
.prov.PRIOR{background:var(--eq-light-violet); color:var(--eq-dark-violet);}
.prov.ASSUMED{background:var(--cloud); color:var(--carbon);}
.prov-key{display:flex; flex-direction:column; gap:5px; margin-bottom:18px; padding:12px 14px; background:var(--silver); border-radius:8px;}
.prov-key .pk{display:flex; gap:9px; align-items:center; font-size:11.5px; color:var(--carbon); font-weight:350;}
.prov-key .prov{flex:none; min-width:56px; justify-content:center;}
.ag-h.ret{color:var(--eq-dark-green);}
.a-entry.retired{background:var(--silver); border-style:dashed;}
.a-entry.retired .a-text{color:var(--carbon); text-decoration:line-through; text-decoration-color:var(--chrome);}
.a-entry.retired .a-resolve{border-top-color:var(--chrome);}
.a-entry .a-oi{margin-left:auto; font-size:10.5px;}
.obb{padding-left:20px; font-size:12.5px;}
.obb li{padding:6px 0; color:var(--carbon); font-weight:350; line-height:1.5;}
.pc-mark{font-size:9.5px; font-weight:800; color:var(--charcoal); background:var(--eq-aqua); border-radius:3px; padding:1px 5px; margin-left:6px;}

/* keep assumption markers atomic — they must never break across lines */
.am{white-space:nowrap;}
.eq-table td:first-child{min-width:210px;}
.eq-item{flex-wrap:wrap;}

/* ============================================================
   v3 — hiring manager side and the connections between portals
   ============================================================ */

/* view switch in the ribbon — a prototype device, not product UI */
.view-switch{display:inline-flex; align-items:center; gap:6px; margin-left:4px;}
.view-switch .vs-label{color:var(--platinum); font-size:11px; letter-spacing:.03em;}
.view-switch .vs{
  border:1px solid var(--carbon); background:none; color:var(--nickel);
  font-family:inherit; font-size:11.5px; font-weight:700; border-radius:99px;
  padding:2px 11px; cursor:pointer;
}
.view-switch .vs:hover{border-color:var(--eq-aqua); color:var(--eq-aqua);}
.view-switch .vs.on{background:var(--eq-aqua); border-color:var(--eq-aqua); color:var(--charcoal);}
body.hm-side .hdr{border-bottom-color:var(--eq-light-violet);}
body.hm-side .brand .sub{color:var(--eq-dark-violet);}

/* ---------- manager: hire tabs ---------- */
.hm-hires{display:flex; gap:10px; margin-bottom:18px; align-items:center; position:relative;}
.hire-tab{
  display:flex; align-items:center; gap:11px; text-align:left; cursor:pointer;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:10px 16px; font-family:inherit; box-shadow:var(--shadow-1); min-width:280px;
}
.hire-tab:hover{border-color:var(--eq-light-violet);}
.hire-tab.on{border-color:var(--eq-dark-violet); box-shadow:0 0 0 2px var(--eq-light-violet);}
.hire-tab.flat{opacity:.62;}
.ht-body{flex:1; min-width:0;}
.ht-name{font-weight:800; font-size:14px; color:var(--charcoal);}
.ht-role{font-size:11.5px; color:var(--ink-faint);}
.ht-days{font-size:11.5px; font-weight:700; color:var(--eq-dark-blue); white-space:nowrap;}
.hires-mark{margin-left:2px;}

/* ---------- manager: readiness hero ---------- */
.hm-hero{
  display:flex; gap:32px; align-items:center; padding:26px 32px; margin-bottom:22px;
  border-radius:var(--radius-lg);
  background:linear-gradient(104deg, var(--eq-light-violet) 0%, var(--eq-light-blue) 62%, var(--eq-light-aqua) 100%);
}
.ready-ring{position:relative; width:118px; height:118px; flex:none;}
.ready-ring svg{width:118px; height:118px; display:block;}
.rr-num{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:30px; font-weight:800; color:var(--eq-dark-blue);
}
.rr-num span{font-size:15px; margin-left:1px;}
.hm-hero-body{flex:1; min-width:0;}
.hm-hero-body h1{font-size:23px; margin-bottom:3px;}
.hm-hero-body .lede{font-size:13.5px; color:var(--charcoal); font-weight:350; margin-bottom:14px;}
.ready-rows{display:flex; flex-direction:column; gap:7px; max-width:520px;}
.ready-row{display:flex; align-items:center; gap:12px; font-size:12.5px;}
.rr-label{width:112px; color:var(--charcoal); font-weight:700; flex:none;}
.rr-bar{flex:1; height:7px; background:rgba(255,255,255,.75); border-radius:99px; overflow:hidden;}
.rr-bar i{display:block; height:100%; border-radius:99px; background:var(--eq-dark-blue);}
.rr-bar i.nh{background:var(--eq-blue);} .rr-bar i.hm{background:var(--eq-dark-violet);} .rr-bar i.tp{background:var(--eq-dark-aqua);}
.rr-count{width:66px; text-align:right; color:var(--carbon); font-weight:700; flex:none;}
.score-caveat{
  display:flex; gap:9px; align-items:flex-start; margin-top:14px; max-width:600px;
  font-size:11.5px; color:var(--charcoal); font-weight:350; line-height:1.5;
  background:rgba(255,255,255,.6); border-radius:8px; padding:9px 13px;
}
.score-caveat .ic{color:var(--eq-dark-orange); margin-top:1px; flex:none;}

/* ---------- manager: blockers ---------- */
.blockers{
  background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--eq-dark-orange);
  border-radius:var(--radius); padding:16px 20px; margin-bottom:22px; box-shadow:var(--shadow-1);
}
.blockers.clear{
  border-left-color:var(--ok); display:flex; align-items:center; gap:12px;
  color:var(--ok); font-weight:700; font-size:14px;
}
.bl-h{display:flex; align-items:center; gap:11px; margin-bottom:10px;}
.bl-h h2{flex:1; font-size:16px;}
.bl-h .ic{color:var(--eq-dark-orange);}
.bl-row{display:flex; align-items:center; gap:11px; padding:8px 0; border-top:1px solid var(--line); font-size:13px;}
.bl-row .bl-dot{width:7px; height:7px; border-radius:50%; flex:none; background:var(--platinum);}
.bl-row.high .bl-dot{background:var(--eq-dark-orange);}
.bl-row.med .bl-dot{background:var(--eq-dark-yellow);}
.bl-text{flex:1; color:var(--carbon); font-weight:350; line-height:1.5;}

/* ---------- manager: layout + task cards ---------- */
.hm-grid{display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:28px; align-items:start;}
.tcard.hm .tic{background:var(--eq-light-violet); color:var(--eq-dark-violet);}
.tcard.hm.done .tic{background:var(--ok-bg); color:var(--ok);}
.tcard.blocked{border-left:3px solid var(--eq-dark-orange);}
.disp-line{display:flex; gap:10px; align-items:baseline; margin-top:9px; flex-wrap:wrap;}
.disp-note{font-size:12px; color:var(--ink-faint); font-weight:350; flex:1; min-width:200px; line-height:1.5;}

/* disposition badges */
.disp{
  display:inline-flex; align-items:center; font-size:10px; font-weight:800; letter-spacing:.05em;
  text-transform:uppercase; border-radius:4px; padding:2px 7px; white-space:nowrap; flex:none;
}
.disp.keep{background:var(--eq-light-green); color:var(--eq-dark-green);}
.disp.reduce{background:var(--eq-light-yellow); color:#8a5a00;}
.disp.automate{background:var(--eq-light-blue); color:var(--eq-dark-blue);}
.disp.remove{background:var(--eq-light-red); color:var(--eq-dark-red);}
.disp.undecided{background:var(--cloud); color:var(--carbon);}
.disp.add{background:var(--eq-light-violet); color:var(--eq-dark-violet);}
.disp-banner{
  display:flex; gap:12px; align-items:flex-start; max-width:760px; margin-top:12px;
  border-radius:10px; padding:11px 16px; font-size:12.5px; font-weight:350;
  color:var(--charcoal); line-height:1.55; background:var(--silver); border:1px solid var(--line);
}
.disp-banner.keep{background:var(--eq-light-green); border-color:#b5ecc4;}
.disp-banner.reduce{background:var(--eq-light-yellow); border-color:#f7e2ad;}
.disp-banner.automate{background:var(--eq-light-blue); border-color:#b9d8ff;}
.disp-banner.add{background:var(--eq-light-violet); border-color:#d9c2f5;}

.subtraction-link{
  display:flex; gap:14px; align-items:center; margin-top:14px; cursor:pointer;
  background:var(--charcoal); color:var(--cloud); border-radius:var(--radius); padding:16px 20px;
}
.subtraction-link:hover{background:var(--black);}
.subtraction-link .ic{color:var(--eq-aqua); flex:none;}
.subtraction-link b{color:var(--white); font-size:14px;}
.subtraction-link p{color:var(--nickel); font-size:12.5px; font-weight:350; margin-top:2px;}
.subtraction-link > div{flex:1;}

/* ---------- manager: new hire progress ---------- */
.nh-progress{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-1); padding:6px 20px 16px;}
.np-row{display:grid; grid-template-columns:1fr auto auto; gap:14px; align-items:center; padding:11px 0; border-bottom:1px solid var(--line);}
.np-label{font-size:13.5px; color:var(--charcoal); font-weight:700;}
.np-lock{display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--ink-faint); font-weight:350;}
.np-note{display:flex; gap:9px; align-items:flex-start; margin-top:13px; font-size:12px; color:var(--carbon); font-weight:350; line-height:1.55;}
.np-note .ic{color:var(--platinum); margin-top:1px; flex:none;}

/* ---------- manager: rail extras ---------- */
.warn-note{display:flex; gap:9px; align-items:flex-start; background:var(--eq-light-yellow); border-radius:8px; padding:10px 13px; border-top:none;}
.warn-note .ic{color:var(--eq-dark-yellow); margin-top:1px; flex:none;}
.quick-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line);}
.quick-row.done{opacity:.72;}
.quick-row > div{flex:1; min-width:0;}
.q-label{font-weight:700; font-size:13px; color:var(--charcoal);}
.q-val{font-size:11.5px; color:var(--ink-faint); margin-top:1px;}
.contact.pending{opacity:.85;}
.contact.pending .avatar{background:var(--silver); color:var(--platinum); border:1px dashed var(--nickel);}

/* ---------- manager: blueprint / logistics ---------- */
.bp-card{background:var(--silver); border:1px solid var(--line); border-radius:10px; padding:6px 18px; max-width:620px;}
.bp-row{display:grid; grid-template-columns:150px 1fr; gap:14px; padding:10px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
.bp-row:last-child{border-bottom:none;}
.bp-row dt{color:var(--ink-faint); font-weight:350;}
.bp-row dd{color:var(--charcoal); font-weight:700;}

/* ---------- manager: computer options ---------- */
.opt-list{display:flex; flex-direction:column; gap:9px; max-width:560px;}
.opt-row{display:flex; gap:12px; align-items:center; cursor:pointer; background:var(--white);
  border:1px solid var(--line); border-radius:10px; padding:13px 16px;}
.opt-row:hover{border-color:var(--eq-light-blue);}
.opt-row.on{border-color:var(--eq-blue); box-shadow:0 0 0 2px var(--eq-light-blue);}
.opt-row input{accent-color:var(--eq-blue); flex:none;}
.opt-main{flex:1; display:flex; align-items:center; gap:14px; justify-content:space-between;}
.opt-label{font-weight:700; font-size:14px; color:var(--charcoal);}
.opt-lead{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--ok); font-weight:700;}
.opt-lead.late{color:var(--warn);}

/* ---------- manager: blocked state ---------- */
.blocked-panel{
  display:flex; gap:18px; align-items:flex-start; max-width:940px;
  background:var(--warn-bg); border:1px solid #f7c9a3; border-radius:var(--radius-lg); padding:24px 28px;
}
.blocked-panel .ic{color:var(--eq-dark-orange); flex:none;}
.blocked-panel h2{font-size:18px; margin-bottom:8px; color:#8a3200;}
.blocked-panel p{color:#7a3a10; font-weight:350; font-size:13.5px; margin-bottom:8px;}
.empty-stack{
  display:flex; align-items:center; justify-content:center; gap:11px; max-width:560px;
  border:2px dashed var(--titanium); border-radius:10px; padding:26px;
  color:var(--ink-faint); font-size:13.5px; font-weight:350;
}

/* ---------- manager: buddy ---------- */
.conflict-banner{
  display:flex; gap:14px; align-items:flex-start; max-width:940px; margin-bottom:22px;
  background:var(--eq-light-red); border:1px solid #f6c2c8; border-radius:var(--radius); padding:16px 20px;
}
.conflict-banner .ic{color:var(--eq-dark-red); flex:none; margin-top:1px;}
.conflict-banner b{display:block; margin-bottom:4px; color:var(--eq-dark-red);}
.conflict-banner p{font-size:13px; font-weight:350; color:#7a1119; line-height:1.55;}
.conflict-toggle{display:flex; align-items:center; gap:9px; margin-top:12px; flex-wrap:wrap; font-size:12.5px; color:#7a1119;}
.pc-btn.sm{padding:4px 11px; font-size:11.5px; border-color:var(--eq-dark-red); color:var(--eq-dark-red);}
.pc-btn.sm.on{background:var(--eq-dark-red); border-color:var(--eq-dark-red); color:var(--white);}
.ct-now{font-weight:700; margin-left:4px;}
.buddy-list{display:flex; flex-direction:column; gap:9px; max-width:620px;}
.buddy-card{
  display:flex; gap:14px; align-items:center; background:var(--white);
  border:1px solid var(--line); border-radius:10px; padding:13px 16px; max-width:620px;
}
.buddy-card.suggested{border-color:var(--eq-light-aqua); background:#F7FEFF;}
.buddy-card.on{border-color:var(--ok); box-shadow:0 0 0 2px var(--ok-bg);}
.buddy-card.over{opacity:.8;}
.bd-body{flex:1; min-width:0;}
.bd-name{font-weight:800; font-size:14px; color:var(--charcoal);}
.bd-role{font-size:12px; color:var(--ink-faint);}
.bd-load{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--carbon); margin-top:3px;}
.bd-load.warn{color:var(--warn); font-weight:700;}
.happens{display:flex; flex-direction:column; gap:9px; max-width:620px;}
.hp-row{display:flex; gap:10px; align-items:flex-start; font-size:13px; color:var(--carbon); font-weight:350; line-height:1.5;}
.hp-row .ic{color:var(--platinum); margin-top:2px; flex:none;}
.hp-row.done .ic{color:var(--ok);}

/* ---------- manager: calendar ---------- */
.cal-day{display:flex; flex-direction:column; gap:9px; max-width:700px;}
.cal-hold{display:flex; gap:16px; align-items:center; padding:13px 16px; border-radius:10px;
  border:1px solid var(--line); background:var(--white);}
.cal-hold.on{border-color:var(--eq-light-blue); background:#F7FBFF;}
.cal-hold.blueprint{background:var(--silver);}
.cal-hold.locked{border-left:3px solid var(--eq-dark-blue);}
.ch-time{font-weight:800; font-size:12.5px; color:var(--eq-dark-blue); width:100px; flex:none;}
.ch-body{flex:1; min-width:0;}
.ch-label{font-weight:700; font-size:13.5px; color:var(--charcoal); display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.ch-note{font-size:11.5px; color:var(--ink-faint); font-weight:350; margin-top:3px;}

/* ---------- manager: welcome email ---------- */
.sys-block{border:1px solid var(--line); border-left:3px solid var(--platinum);
  background:var(--silver); border-radius:8px; padding:13px 16px; margin-top:14px; font-size:13px;}
.sys-block .sb-h{display:flex; gap:6px; align-items:center; font-size:10.5px; font-weight:800;
  letter-spacing:.05em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:7px;}
.sys-block ol{padding-left:20px; margin-top:5px; color:var(--carbon); font-weight:350;}
.sys-block li{padding:2px 0;}
.sb-note{font-size:11.5px; color:var(--ink-faint); font-weight:350; margin-top:8px; font-style:italic;}

/* ---------- manager: network picker ---------- */
.net-card.hm .nc-top{align-items:center;}
.net-card.hm.on{border-color:var(--eq-dark-violet); box-shadow:0 0 0 2px var(--eq-light-violet);}
.nc-reason{margin-top:12px; padding-top:12px; border-top:1px dashed var(--line);}
.nc-reason label{display:block; font-weight:700; font-size:12.5px; color:var(--charcoal); margin-bottom:5px;}
.nc-reason .req{font-weight:700; font-size:10px; color:var(--eq-dark-red); background:var(--eq-light-red);
  border-radius:3px; padding:1px 5px; margin-left:5px; letter-spacing:.04em;}
.nc-reason textarea{width:100%; font-family:inherit; font-size:13.5px; padding:9px 12px;
  border:1px solid var(--titanium); border-radius:8px; outline:none; resize:vertical;}
.nc-reason textarea:focus{border-color:var(--eq-blue); box-shadow:0 0 0 3px var(--eq-light-blue);}
.nc-reason .note{display:flex; gap:6px; align-items:center; font-size:11.5px; color:var(--ink-faint); margin-top:5px;}

/* ---------- new hire: waiting on the manager ---------- */
.waiting-panel{
  display:flex; gap:20px; align-items:flex-start; max-width:820px;
  background:var(--surface); border:1px dashed var(--line-strong); border-radius:var(--radius-lg); padding:30px 34px;
}
.waiting-panel .ic{color:var(--nickel); flex:none;}
.waiting-panel h2{font-size:18px; margin-bottom:8px;}
.waiting-panel p{font-weight:350; font-size:14px; margin-bottom:10px; max-width:560px;}
.wp-note{display:flex; gap:8px; align-items:flex-start; font-size:12.5px; color:var(--ink-faint);}
.tcard.optional.pending{opacity:.85;}

/* ---------- new hire: the manager's welcome note ---------- */
.welcome-note{
  display:flex; gap:16px; align-items:flex-start; margin-bottom:20px; padding:20px 24px;
  background:linear-gradient(100deg, var(--eq-light-violet), var(--eq-light-blue));
  border-radius:var(--radius-lg);
}
.wn-body{flex:1; min-width:0;}
.wn-h{font-size:11.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase;
  color:var(--eq-dark-violet); margin-bottom:7px;}
.wn-text{font-size:13.5px; color:var(--charcoal); font-weight:350; white-space:pre-wrap; line-height:1.6;}

/* ---------- subtraction review ---------- */
.disp-legend{display:flex; flex-wrap:wrap; gap:16px; margin-bottom:24px; padding:14px 18px;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);}
.dl-item{display:inline-flex; align-items:center; gap:8px; font-size:12px; color:var(--carbon); font-weight:350;}
.sub-group{margin-bottom:26px;}
.sg-h{display:flex; align-items:center; gap:12px; margin-bottom:10px;}
.sg-h h2{flex:1; font-size:16px;}
.sg-count{font-size:12px; font-weight:700; color:var(--ink-faint); background:var(--cloud);
  border-radius:99px; padding:2px 10px;}
.sub-rows{display:flex; flex-direction:column; gap:9px;}
.sub-row{display:grid; grid-template-columns:270px 1fr; gap:20px;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:15px 20px;}
.sub-row.struck .sr-task{text-decoration:line-through; text-decoration-color:var(--chrome); color:var(--carbon);}
.sr-task{font-weight:800; font-size:14px; color:var(--charcoal); line-height:1.35;}
.sr-body{display:flex; flex-direction:column; gap:5px;}
.sr-line{font-size:12.5px; color:var(--carbon); font-weight:350; line-height:1.55;}
.sr-line b{color:var(--charcoal); font-weight:700;}
.sr-line.cond{padding-top:5px; border-top:1px dashed var(--line);}

/* ---------- handoffs ---------- */
.ho-table{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg);
  box-shadow:var(--shadow-1); overflow:hidden;}
.ho-head, .ho-row{display:grid; grid-template-columns:250px 40px 250px 1fr; gap:14px; align-items:center;}
.ho-head{padding:12px 22px; background:var(--silver); border-bottom:1px solid var(--line);
  font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint);}
.ho-row{padding:13px 22px; border-bottom:1px solid var(--line);}
.ho-row:last-child{border-bottom:none;}
.ho-row.conflict{background:#FFF8F8;}
.ho-side{display:flex; align-items:center; gap:8px; text-align:left; cursor:pointer;
  font-family:inherit; font-size:13px; font-weight:700; border-radius:8px; padding:8px 12px;
  border:1px solid var(--line); background:var(--white); color:var(--charcoal); width:100%;}
.ho-side:hover{border-color:var(--eq-blue);}
.ho-side.hm{border-left:3px solid var(--eq-dark-violet);}
.ho-side.hm .ic{color:var(--eq-dark-violet);}
.ho-side.nh{border-left:3px solid var(--eq-blue);}
.ho-side.nh .ic{color:var(--eq-blue);}
.ho-arrow{text-align:center; font-size:17px; color:var(--nickel); font-weight:700;}
.ho-row.live .ho-arrow{color:var(--ok);}
.ho-state{display:flex; align-items:center; gap:9px; font-size:12.5px; color:var(--carbon); font-weight:350; flex-wrap:wrap;}
.ho-dot{width:8px; height:8px; border-radius:50%; background:var(--nickel); flex:none;}
.ho-dot.on{background:var(--ok);}
.ho-note{display:flex; gap:14px; align-items:flex-start; margin-top:20px; padding:16px 20px;
  background:var(--eq-light-red); border-radius:var(--radius); font-size:13px; color:#7a1119; font-weight:350; line-height:1.55;}
.ho-note .ic{color:var(--eq-dark-red); flex:none;}
.ho-note b{color:var(--eq-dark-red);}

/* ---------- assumptions panel: sides ---------- */
.side-filter{display:flex; gap:6px; margin-bottom:14px;}
.side-filter .sf{
  flex:1; border:1px solid var(--line-strong); background:var(--white); color:var(--carbon);
  font-family:inherit; font-size:11.5px; font-weight:700; border-radius:8px; padding:7px 4px; cursor:pointer;
}
.side-filter .sf span{display:block; font-size:14px; font-weight:800; color:var(--charcoal);}
.side-filter .sf:hover{border-color:var(--eq-blue);}
.side-filter .sf.on{background:var(--eq-dark-blue); border-color:var(--eq-dark-blue); color:var(--eq-light-blue);}
.side-filter .sf.on span{color:var(--white);}
.a-id.hm{background:var(--eq-light-violet); color:var(--eq-dark-violet);}
.a-id.link{background:var(--eq-light-yellow); color:#8a5a00;}
.side-tag{font-size:10px; font-weight:700; color:var(--ink-faint); border:1px solid var(--line-strong);
  border-radius:3px; padding:0 5px;}
.side-tag.hm{color:var(--eq-dark-violet); border-color:var(--eq-light-violet);}
.side-tag.link{color:#8a5a00; border-color:#f7e2ad;}
.obb-h{font-size:11.5px; font-weight:800; color:var(--carbon); margin:12px 0 4px;}

/* ============================================================
   v3 gap-closing pass — carousel, start date, background check,
   the real document pack
   ============================================================ */

/* Inside Equinix carousel (A-35) */
.carousel{
  display:flex; align-items:center; gap:26px; margin-bottom:18px;
  border-radius:var(--radius-lg); padding:20px 28px;
  background:linear-gradient(102deg, var(--eq-dark-violet) 0%, var(--eq-dark-blue) 58%, var(--eq-dark-aqua) 100%);
  color:var(--white); position:relative; overflow:hidden;
}
.car-left{flex:1; min-width:0;}
.car-eyebrow{
  display:flex; align-items:center; gap:7px; font-size:11px; font-weight:800;
  letter-spacing:.09em; text-transform:uppercase; color:var(--eq-aqua); margin-bottom:10px;
}
.car-body{display:flex; align-items:baseline; gap:16px;}
.car-num{font-size:34px; font-weight:800; color:rgba(255,255,255,.32); line-height:1; flex:none;}
.car-title{font-size:19px; font-weight:800; color:var(--white); line-height:1.2;}
.car-line{font-size:13.5px; font-weight:350; color:rgba(255,255,255,.82); margin-top:3px;}
.car-foot{font-size:11.5px; font-weight:350; color:rgba(255,255,255,.6); margin-top:12px;}
.car-nav{display:flex; align-items:center; gap:12px; flex:none;}
.car-arrow{
  width:30px; height:30px; border-radius:50%; border:1px solid rgba(255,255,255,.35);
  background:none; color:var(--white); cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.car-arrow:hover{background:rgba(255,255,255,.16);}
.car-dots{display:flex; gap:6px;}
.car-dot{
  width:7px; height:7px; border-radius:50%; border:none; padding:0; cursor:pointer;
  background:rgba(255,255,255,.35);
}
.car-dot.on{background:var(--eq-aqua); width:18px; border-radius:99px;}

/* Confirm your start date (A-49) */
.date-card{
  display:flex; align-items:center; gap:20px; max-width:620px;
  background:var(--eq-light-blue); border-radius:var(--radius-lg); padding:22px 26px;
}
.date-card.ok{background:var(--ok-bg);}
.date-card .ic{color:var(--eq-dark-blue); flex:none;}
.date-card.ok .ic{color:var(--ok);}
.dc-label{font-size:11px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--eq-dark-blue); opacity:.75;}
.dc-date{font-size:22px; font-weight:800; color:var(--charcoal); margin-top:3px;}
.dc-sub{font-size:12.5px; color:var(--carbon); font-weight:350;}
.date-card > div:nth-child(2){flex:1;}

/* Background check (A-50) */
.bg-status{display:flex; gap:20px; align-items:flex-start; max-width:680px;
  background:var(--eq-light-aqua); border-radius:var(--radius-lg); padding:22px 26px;}
.bg-status .ic{color:var(--eq-dark-aqua); flex:none;}
.bg-state{display:inline-flex; align-items:center; gap:7px; font-weight:800; font-size:14px; color:var(--eq-dark-aqua); margin-bottom:6px;}
.bg-status p{font-size:13.5px; font-weight:350; color:var(--charcoal);}

/* The real document pack (A-51) */
.read-card.stack{flex-direction:column; align-items:stretch; gap:0;}
.read-card.stack .rc-top{display:flex; gap:13px; align-items:flex-start;}
.pack-flag{
  display:flex; gap:9px; align-items:flex-start; margin-top:12px; padding:11px 14px;
  background:var(--warn-bg); border-radius:8px; font-size:12.5px; color:#7a3a10; font-weight:350; line-height:1.55;
}
.pack-flag .ic{color:var(--eq-dark-orange); margin-top:1px; flex:none;}
.pack-flag b{color:#8a3200;}

/* provenance tags added in this pass */
.prov.PRD{background:var(--eq-light-blue); color:var(--eq-dark-blue);}
.prov.CURRENT{background:var(--warn-bg); color:#8a3200;}

</style>
</head>

function hmDone() { return hmTasks().filter(t => t.done).length; }

/* Third-party tasks — PEX, EUT, CRE. Fixed states; not interactive. */
function thirdPartyTasks() {
  return [
    { label:'Background check', owner:'HR Operations', state: 'running', note:'In progress — no action from anyone' },
    { label:'Badge printed', owner:'Workplace / CRE', state: S.photo.done || S.photo.confirmedExisting ? 'ready' : 'waiting',
      note: (S.photo.done || S.photo.confirmedExisting) ? 'Photo received — queued for print' : 'Waiting on Jordan’s badge photo' },
    { label:'Orientation blueprint assigned', owner:'People Experience', state:'ready', note:'Denver blueprint assigned' },
  ];
}

/* ---------- readiness score (M-02) ---------- */
function readiness() {
  const nhTotal = COUNTED.length, nhDone = tasksComplete();
  const hmList = hmTasks(), hmTotal = hmList.length, hmDoneN = hmList.filter(t => t.done).length;
  const tp = thirdPartyTasks(), tpTotal = tp.length, tpDone = tp.filter(t => t.state === 'ready').length;
  const total = nhTotal + hmTotal + tpTotal, done = nhDone + hmDoneN + tpDone;
  return {
    pct: Math.round((done / total) * 100), done, total,
    rows: [
      { label:'Jordan’s tasks', done:nhDone, total:nhTotal, cls:'nh' },
      { label:'Your tasks', done:hmDoneN, total:hmTotal, cls:'hm' },
      { label:'Other teams', done:tpDone, total:tpTotal, cls:'tp' },
    ],
  };
}

/* ---------- blockers ---------- */
function hmBlockers() {
  const out = [];
  const days = daysToStart();
  if (!S.hm.computer.ordered) {
    out.push({ sev:'high', text:'The computer has not been ordered. Nothing ships until you place the order, and Jordan can see it is waiting on you.',
      action:'Order it', route:'#/hm/computer' });
  }
  if (!S.hm.buddy.assigned && days <= 21) {
    out.push({ sev:'med', text:'No buddy assigned yet. If you do not choose one, a buddy is auto-assigned from the pool the day before Jordan starts.',
      action:'Choose a buddy', route:'#/hm/buddy' });
  }
  COUNTED.forEach(k => {
    if (isOverdue(k)) out.push({ sev:'med', text:`Jordan’s “${NH_TASK_LABELS[k]}” is past its due date and still open.`, action:'See status', route:null });
  });
  if (S.hm.card.needed === null && days <= 21) {
    out.push({ sev:'low', text:'The corporate card question is unanswered. If Jordan will travel, they need the agreement ready to sign on their second day.',
      action:'Answer it', route:'#/hm/card' });
  }
  if (!S.hm.software.confirmed) {
    out.push({ sev:'low', text:'The application stack cannot be resolved — Jordan’s persona is not mapped. This is a platform gap, not something you can fix here.',
      action:'See why', route:'#/hm/software' });
  }
  return out;
}

    <div class="conflict-banner" data-assume="L-01">
      ${ic('exclamation-triangle.svg','lg')}
      <div>
        <b>Unresolved: when does Jordan see this name? ${am('L-01')}</b>
        <p>The specification says the buddy’s contact card appears to the new hire <b>72 hours before their start date</b>.
        The new hire prototype shows the buddy <b>as soon as you assign one</b> — which right now is ${daysToStart()} days early.
        Both cannot be right, and you can change your mind up to 3 days before Jordan starts, which would remove a name

      </div>
    </div>

    <div class="task-shell">
      <div class="wiz-body">
        <div class="form-sec" data-assume="M-07">
          <h3>Suggested ${am('M-07')}</h3>

              <div class="bd-name">${suggested.name}</div>

          <div class="callout soft">
            ${ic('lock.svg')}
            <div><b>Why this person is suggested is deliberately not shown.</b> The suggestion criteria include a
            performance signal, which would make this screen show you an inference about another employee’s performance.
            There is no privacy position on that yet, so the prototype withholds it — and the capacity limit below is invented. ${am('M-07')}</div>
          </div>
        </div>

        <div class="form-sec">
          <h3>Or choose someone else</h3>
          <div class="buddy-list">
            ${BUDDY_POOL.filter(b => !b.suggested).map(b => {
              const over = b.load >= BUDDY_LOAD_LIMIT;
              return `
              <div class="buddy-card ${B.assigned===b.id?'on':''} ${over?'over':''}">
                <div class="avatar peer">${b.initials}</div>
